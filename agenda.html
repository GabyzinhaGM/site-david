<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Agenda - David Meireles</title>

  <link rel="stylesheet" href="style.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
    rel="stylesheet"
  >
</head>

<body>

<header>
  <h1>Agenda</h1>

  <nav aria-label="Menu principal">
    <a href="index.html">Home</a>
    <a href="agenda.html" aria-current="page">Agenda</a>
    <a href="orcamento.html">Orçamento</a>
    <a href="sobre.html">Sobre</a>
  </nav>
</header>

<main>

  <section aria-label="Agenda de shows">

    <h2>Próximos shows</h2>

    <div id="agenda">
      <p>Carregando agenda...</p>
    </div>

    <p style="margin-top:20px; color:#ccc;">
      Agenda sujeita a alterações. Novas datas serão adicionadas em breve.
    </p>

  </section>

  <section style="text-align:center; margin-top:30px;">
    <a href="index.html" class="btn-voltar">
      ← Voltar para Home
    </a>
  </section>

</main>

<footer>
  <p>© 2026 David Meireles</p>

  <p>
    Desenvolvido por
    <a
      href="https://www.linkedin.com/in/gabriela-godoy-228390a3"
      target="_blank"
      rel="noopener"
    >
      Gabriela Godoy
    </a>
  </p>
</footer>

<script>

const SUPABASE_URL = "https://msgvcxaerouwkswhsudv.supabase.co";

const SUPABASE_KEY = "sb_publishable_CfeoEMG2xpSDxnHxgxm0tQ_-dEJJZhf";

const agenda = document.getElementById("agenda");

async function carregarAgenda() {

  try {

    const resposta = await fetch(
      `${SUPABASE_URL}/rest/v1/agenda?select=*&order=data.asc,horario.asc`,
      {
        method: "GET",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!resposta.ok) {
      throw new Error("Erro ao carregar a agenda.");
    }

    const eventos = await resposta.json();

    agenda.innerHTML = "";

    if (eventos.length === 0) {

      agenda.innerHTML = `
        <p>Nenhum show cadastrado no momento.</p>
      `;

      return;
    }

    eventos.forEach(function(evento) {

      const item = document.createElement("article");

      item.className = "agenda-item";

      const data = new Date(evento.data + "T00:00:00");

      const dataFormatada = data.toLocaleDateString("pt-BR");

      let horario = "";

      if (evento.horario) {

        horario = evento.horario.substring(0, 5);

      }

      let texto = `
        <p>
          <strong>${dataFormatada}</strong>
          -
          ${evento.local}
          (${evento.cidade}/${evento.estado})
        </p>
      `;

      if (horario) {

        texto += `
          <p>Horário: ${horario}</p>
        `;

      }

      if (evento.tipo_evento) {

        texto += `
          <p>Tipo: ${evento.tipo_evento}</p>
        `;

      }

      if (evento.privado) {

        texto += `
          <p>Evento privado</p>
        `;

      }

      if (evento.link) {

        texto += `
          <p>
            <a
              href="${evento.link}"
              target="_blank"
              rel="noopener"
            >
              Mais informações
            </a>
          </p>
        `;

      }

      item.innerHTML = texto;

      agenda.appendChild(item);

    });

  } catch (erro) {

    console.error(erro);

    agenda.innerHTML = `
      <p>
        Não foi possível carregar a agenda no momento.
      </p>
    `;

  }

}

carregarAgenda();

</script>

</body>

</html>
